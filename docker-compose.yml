services:
  app:
    build: ./docker/php
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_LOCALE: es
      APP_FAKER_LOCALE: es_ES
      PDF_SERVICE_URL: http://pdf:3000
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      PDF_SERVICE_TOKEN: ${PDF_SERVICE_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      pdf:
        condition: service_healthy

  # SPA compilada + nginx como proxy inverso hacia app
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - app

  # Microservicio de PDF: sin puerto publicado, solo accesible desde la red interna
  pdf:
    build: ./services/pdf-service
    environment:
      PDF_SERVICE_TOKEN: ${PDF_SERVICE_TOKEN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: